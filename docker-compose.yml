# Local dependencies for development. The app runs on the host with ./gradlew bootRun.
# Usage: docker compose up -d   (reads MINIO_ROOT_USER / MINIO_ROOT_PASSWORD from .env)
#
# The MinIO image is not pulled from Docker Hub; load it once from the shared tar:
#   docker load -i minio.tar
#   docker tag minio/minio:latest minio/minio:RELEASE.2025-09-07T16-13-09Z

x-minio-image: &minio-image
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z
  pull_policy: never

services:
  minio:
    <<: *minio-image
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      # Bound to localhost only: S3 API and web console
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: creates the documents bucket with the mc bundled in the MinIO image, then exits
  minio-init:
    <<: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET: ${TDDS_STORAGE_S3_BUCKET:-tdds-documents}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing \"local/$${BUCKET}\"
      "
    restart: "no"

volumes:
  minio-data:
