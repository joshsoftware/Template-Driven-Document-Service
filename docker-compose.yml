# Local stack for development and testing. bootRun and the Docker app use the same .env, unchanged:
# Postgres is the one on the host (DB_URL), Redis and MinIO run here on localhost ports.
#   Dependencies only (app runs on the host with ./gradlew bootRun):  docker compose up -d
#   Full stack, app in Docker:                                         docker compose --profile app up -d --build
# Every setting and credential comes from .env (see .env.example); nothing is hard-coded here.
#
# The MinIO image is not pulled from Docker Hub; load it once from the shared tar:
#   docker load -i minio.tar
#   docker tag minio/minio:latest minio/minio:RELEASE.2025-09-07T16-13-09Z

x-minio-image: &minio-image
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z
  pull_policy: never

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    <<: *minio-image
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      # Bound to localhost only: S3 API and web console
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: creates the documents bucket with the mc bundled in the MinIO image, then exits.
  # Host network, so it reaches MinIO at the same TDDS_STORAGE_S3_ENDPOINT as the app.
  minio-init:
    <<: *minio-image
    network_mode: host
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET: ${TDDS_STORAGE_S3_BUCKET:?set TDDS_STORAGE_S3_BUCKET in .env}
      S3_ENDPOINT: ${TDDS_STORAGE_S3_ENDPOINT:?set TDDS_STORAGE_S3_ENDPOINT in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set local \"$${S3_ENDPOINT}\" \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing \"local/$${BUCKET}\"
      "
    restart: "no"

  # The app itself, built from the Dockerfile; only started with --profile app.
  # Host network, so localhost means the host: same DB_URL, Redis and MinIO addresses as bootRun,
  # and it listens on the host's PORT directly. Linux (or Docker Desktop with host networking).
  app:
    profiles: ["app"]
    build: .
    image: tdds-app:local
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env

volumes:
  minio-data:
