spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

logging:
  level:
    root: WARN
    com.joshsoftware.templateDrivenDocumentService: INFO

tdds:
  storage:
    s3:
      # AWS S3. No endpoint and no keys: credentials come from the IAM role via the default provider chain.
      server-side-encryption: ${TDDS_STORAGE_S3_SSE:AES256}
