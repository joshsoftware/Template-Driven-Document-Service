spring:
  application:
    name: template-driven-document-service
  config:
    # Load .env from the working directory when present. Real environment variables take precedence.
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  jackson:
    deserialization:
      # Read JSON decimals as BigDecimal, not Double, so amounts keep their exact value and scale.
      use-big-decimal-for-floats: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    
tdds:
  engine:
    # Zone for "today" in documents (statement date, generated at)
    zone: ${TDDS_ENGINE_ZONE:Asia/Kolkata}
  storage:
    # Generated PDFs. MinIO in development, AWS S3 on staging and production (see the profile files).
    s3:
      bucket: ${TDDS_STORAGE_S3_BUCKET}
      region: ${TDDS_STORAGE_S3_REGION:ap-south-1}
      api-call-timeout: ${TDDS_STORAGE_S3_API_CALL_TIMEOUT:30s}

server:
  port: ${PORT:8080}
logging:
  pattern:
    # Adds the MDC request id and job id (set by RequestIdFilter) to every log line.
    correlation: "[requestId=%X{requestId:-} jobId=%X{jobId:-}] "
