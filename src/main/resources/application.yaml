spring:
  application:
    name: template-driven-document-service
  config:
    # Load .env from the working directory when present. Real environment variables take precedence.
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  jackson:
    deserialization:
      # Read JSON decimals as BigDecimal, not Double, so amounts keep their exact value and scale.
      use-big-decimal-for-floats: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    
tdds:
  storage:
    local:
      # Folder for generated PDFs until S3 storage is added
      root: ${TDDS_STORAGE_LOCAL_ROOT:./storage}

server:
  port: ${PORT:8080}
logging:
  pattern:
    # Adds the MDC request id and job id (set by RequestIdFilter) to every log line.
    correlation: "[requestId=%X{requestId:-} jobId=%X{jobId:-}] "
