spring:
  application:
    name: template-driven-document-service
  config:
    # Load .env from the working directory when present. Real environment variables take precedence.
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
