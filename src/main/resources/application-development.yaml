spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/template_docs}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: ERROR
    com.joshsoftware.templateDrivenDocumentService: DEBUG
